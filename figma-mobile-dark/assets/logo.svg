<svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g id="logo">
<!-- The frame is two filled shapes rather than a stroked one. A stroke is
     centred on its path, so the Figma export put the outline across the
     viewBox edge at x=0.5 with a 1 unit width. Rendered at 32px the 46 unit
     artwork scales by 0.696, which turns that outline into 0.7px straddling
     a pixel boundary on every side: the soft corners. Filling an outer shape
     and laying the body on top of it leaves no sub pixel geometry, so the
     only antialiasing left is the corner curve itself. -->
<rect width="46" height="46" rx="12.5" fill="url(#paint1_linear_0_4)"/>
<rect x="1" y="1" width="44" height="44" rx="11.5" fill="url(#paint0_linear_0_4)"/>
